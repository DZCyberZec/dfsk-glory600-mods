name: DFSKRemote
options:
  bundleIdPrefix: it.cyberzec
  deploymentTarget:
    iOS: "17.0"
targets:
  DFSKRemote:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.cyberzec.dfskremote
        DEVELOPMENT_TEAM: ""   # your Apple team ID
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: CyberZec Remote
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CyberZec Remote
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Per inquadrare il QR mostrato da CyberZec Set in auto.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Per parlare con CyberZec Set sull'auto, nella stessa rete Wi-Fi o hotspot.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
    info:
      path: Sources/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
